<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecture 2 Quiz</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231e;--mut:#5d6e68;--line:#d4ddd9;--acc:#0f766e;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#17241f;--ink:#e8f1ed;--mut:#9fb2ab;--line:#2c3f38;--acc:#2dd4bf;--ok:#4ade80;--okb:#12351f;--bad:#f87171;--badb:#3b1616}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100%}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px}
p{margin:0 0 12px}.mut{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:block;width:100%;padding:14px 16px;margin:10px 0;border-radius:12px;border:2px solid var(--acc);background:var(--card);text-align:left}
.btn b{display:block}.btn.main{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.main{color:#06201c}}
:root[data-theme="dark"] .btn.main{color:#06201c}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:13px;color:var(--acc);margin-bottom:6px}
.q{font-size:20px;line-height:1.35;margin:4px 0 16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:13px 14px;margin:8px 0;background:var(--card);border:2px solid var(--line);border-radius:12px}
.opt span{font-weight:700;color:var(--acc);min-width:18px}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--bad);background:var(--badb)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:12px;background:var(--card);border:2px solid var(--line);margin:12px 0}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.big{font-size:56px;font-weight:700;color:var(--acc);margin:6px 0 0;line-height:1}
.row{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}
.row .bar{flex:1;margin:0}.row div:first-child{width:46%}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body><main id="app"></main>
<script>
var Q=[["In the human–machine comparison, sensors correspond to…", ["Receptors", "Muscles", "Nerves", "Metabolism"], "Receptors sense stimuli."], ["The controller in the body is the…", ["Nervous/endocrine systems", "Skeleton", "Muscles", "Receptors"], "Controllers integrate and decide."], ["Actuators in the body are…", ["Muscles (and glands)", "Receptors", "Bones only", "Hormones only"], "Muscle or gland carries out the response."], ["The body’s power source is…", ["Metabolism", "Receptors", "Homeostasis", "Bones"], "Power source = metabolism."], ["Which sequence describes a biological system?", ["Sensing → integration → decision → response → feedback", "Response → sensing → decision", "Decision → sensing → feedback", "Feedback → sensing only"], "This is the lecture’s sequence."], ["Homeostasis means…", ["Keeping variables within an appropriate range despite change", "Nothing ever changes", "Keeping everything constant", "Ignoring the environment"], "Homeostasis ≠ no change."], ["In mass balance, ΔM = 0 means…", ["Inputs equal outputs (homeostasis)", "Weight gain", "Weight loss", "Failure"], "Input − output = 0."], ["During exercise, rising muscle activity leads to…", ["↑ O₂ demand, then ↑ ventilation and ↑ cardiac output", "↓ O₂ demand", "↓ ventilation", "↓ cardiac output"], "Organ function → system interaction → regulation."], ["Case: During exercise O₂ demand rises. Which systems work together to deliver more O₂?", ["Respiratory and circulatory", "Digestive and skeletal", "Renal and integumentary", "Endocrine only"], "Ventilation and cardiac output increase."], ["“Homeostasis” combines Greek words meaning…", ["Similar to + standing", "Different + moving", "Change + chemical", "Balance + weight"], "Homeo = similar; stasis = standing."], ["Which is the correct negative feedback loop order?", ["Disturbance → sensor → controller → actuator → system", "Sensor → system → disturbance", "Actuator → sensor → controller", "Controller → disturbance → sensor"], "The loop resists deviation from the set point."], ["In negative feedback F = −k·ΔV. If the variable rises…", ["Feedback reduces it", "Feedback raises it further", "Nothing happens", "Feedback stops"], "ΔV → 0 around the set point."], ["In positive feedback F = +k·ΔV, the change…", ["Is amplified until a stop signal", "Returns to set point", "Is cancelled", "Never starts"], "Example: oxytocin in childbirth, clotting."], ["Case: A cut activates platelets, which recruit more platelets until bleeding stops. This is…", ["Positive feedback", "Negative feedback", "Osmosis", "Active transport"], "Clot formation amplifies itself."], ["Case: Body temperature rises, sweating begins and temperature returns to normal. This is…", ["Negative feedback", "Positive feedback", "Facilitated diffusion", "Vesicular transport"], "The response opposes the rise."], ["The ECF is made of…", ["Plasma plus interstitial fluid", "Cytoplasm only", "Plasma only", "Interstitial fluid and cytoplasm"], "ECF = plasma + ISF."], ["Compared with ECF, ICF has…", ["High K⁺ and low Na⁺", "High Na⁺ and low K⁺", "High Cl⁻", "Lower osmolarity"], "ICF is K⁺-rich; ECF is Na⁺ and Cl⁻ rich."], ["Which ion is high in ECF but low in ICF?", ["Na⁺", "K⁺", "Protein", "Mg²⁺"], "Na⁺ ~145 mmol/L ECF vs ~10 ICF."], ["The osmolarity of ICF and ECF is about…", ["300 mOsm/L", "150 mOsm/L", "600 mOsm/L", "30 mOsm/L"], "The compartments are osmotically balanced."], ["A glucose sensor relies on which signal type?", ["Chemical", "Electrical", "Mechanical", "Immune"], "ECG/EEG: electrical; BP sensor: mechanical."], ["As the concentration difference approaches zero, net flux…", ["Approaches zero", "Doubles", "Becomes negative", "Is unchanged"], "Molecules keep moving randomly."], ["Which uses simple diffusion?", ["O₂ across the alveolar membrane", "Na⁺/K⁺ pump", "Insulin secretion", "Phagocytosis"], "It needs no carrier and no ATP."], ["Case: If the alveolar membrane becomes thicker, oxygen diffusion…", ["Decreases", "Increases", "Is unchanged", "Stops completely at once"], "A thicker barrier lowers flux. Relevant to oxygenators."], ["Facilitated diffusion saturates because…", ["The number of transport proteins is limited", "ATP runs out", "Gradients vanish", "Water leaves"], "More solute cannot raise transport indefinitely."], ["Osmotic pressure depends on…", ["The number of particles per unit volume", "The mass of particles", "Temperature alone", "Colour"], "Number of particles, not mass."], ["A hypertonic solution makes a cell…", ["Shrink as water leaves", "Swell", "Stay unchanged", "Divide"], "Water moves out of the cell."], ["Case: An IV solution that is too hypotonic would cause cells to…", ["Swell as water enters", "Shrink", "Stay the same", "Produce ATP"], "0.9% NaCl is approximately isotonic."], ["The Na⁺/K⁺ ATPase moves…", ["3 Na⁺ out and 2 K⁺ in using ATP", "2 Na⁺ out and 3 K⁺ in", "3 Na⁺ in and 2 K⁺ out", "Na⁺ in by diffusion"], "This is primary active transport."], ["The Na⁺/glucose cotransporter is…", ["Secondary active transport using a stored gradient", "Primary active transport", "Simple diffusion", "Exocytosis"], "The Na⁺ gradient drives glucose uptake."], ["Insulin secretion is an example of…", ["Exocytosis", "Endocytosis", "Osmosis", "Simple diffusion"], "Vesicles release contents outside the cell."]];
var T=["Body as a system", "Homeostasis & exercise", "Feedback loops", "Fluid compartments", "Diffusion & osmosis", "Tonicity & active transport"];
function tp(i){return Math.floor(i/5)}
function cs(i){return Q[i][0].indexOf("Case:")==0}
var app=document.getElementById("app"),S={},missed=[];
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function home(){S={};
app.innerHTML='<h1>Lecture 2 quiz</h1><p class="mut">'+Q.length+' questions on homeostasis, feedback, fluid compartments and membrane transport, with case studies. Answer, get instant feedback, build a streak.</p>'
+'<button class="btn main" onclick="go(10)"><b>Quick round</b>10 random questions</button>'
+'<button class="btn" onclick="go(\'c\')"><b>Case studies</b>Scenario questions only</button>'
+'<button class="btn" onclick="go(30)"><b>Full run</b>All '+Q.length+', shuffled</button>'
+(missed.length?'<button class="btn" onclick="go(0)"><b>Weak spots</b>Retry the '+missed.length+' you missed</button>':'')
+T.map(function(t,k){return '<button class="btn" onclick="go(-'+(k+1)+')"><b>'+t+'</b>One topic only</button>'}).join("");}
function go(n){var ids=[];for(var i=0;i<Q.length;i++)ids.push(i);
if(n===0)ids=missed.slice();else if(n==="c")ids=ids.filter(cs);else if(n<0)ids=ids.filter(function(i){return tp(i)===-n-1});
ids=sh(ids);if(n>0)ids=ids.slice(0,n);
S={ids:ids,p:0,sc:0,st:0,best:0,miss:[],tt:{}};show();}
function show(){if(S.p>=S.ids.length)return end();
var i=S.ids[S.p],q=Q[i],o=sh([0,1,2,3]);S.cur={i:i,o:o,a:false};var L="ABCD",c=cs(i);
var txt=q[0].replace("Case: ","");
app.innerHTML='<div class="top"><span>Question '+(S.p+1)+' of '+S.ids.length+'</span><span>'+(S.st>1?S.st+' in a row 🔥':'Score '+S.sc)+'</span></div>'
+'<div class="bar"><i style="width:'+(S.p/S.ids.length*100)+'%"></i></div>'
+'<div class="tag">'+T[tp(i)]+(c?' · Case study':'')+'</div><p class="q">'+txt+'</p>'
+o.map(function(k,n){return '<button class="opt" onclick="pick('+n+')"><span>'+L[n]+'</span>'+q[1][k]+'</button>'}).join("")+'<div id="fb"></div>';}
function pick(n){var c=S.cur;if(c.a)return;c.a=true;var q=Q[c.i],ok=c.o[n]===0,b=app.querySelectorAll(".opt"),t=tp(c.i);
S.tt[t]=S.tt[t]||[0,0];S.tt[t][1]++;
b.forEach(function(x,k){x.disabled=true;if(c.o[k]===0)x.classList.add("ok");else if(k===n)x.classList.add("no")});
if(ok){S.sc++;S.st++;S.tt[t][0]++;if(S.st>S.best)S.best=S.st}else{S.st=0;S.miss.push(c.i)}
var m=ok?(S.st>=5?"Unstoppable! ":S.st>=3?"Streak! ":"Correct! "):"Not quite. ";
document.getElementById("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+m+'</b>'+q[2]+'</div><button class="btn main" id="nx" style="text-align:center" onclick="S.p++;show()">'+(S.p+1>=S.ids.length?"See results":"Next question")+'</button>';
document.getElementById("nx").focus();}
function end(){var n=S.ids.length,pc=Math.round(S.sc/n*100);missed=S.miss.slice();
var r=pc>=90?"Physiology pro 🧠":pc>=70?"Strong signal":pc>=50?"Getting there":"Back to the slides";
app.innerHTML='<p class="mut">Round complete</p><div class="big">'+S.sc+'/'+n+'</div><h1>'+r+'</h1><p class="mut">Best streak: '+S.best+' in a row</p>'
+Object.keys(S.tt).map(function(k){var v=S.tt[k];return '<div class="row"><div>'+T[k]+'</div><div class="bar"><i style="width:'+(v[0]/v[1]*100)+'%"></i></div><div>'+v[0]+'/'+v[1]+'</div></div>'}).join("")
+(missed.length?'<button class="btn main" style="text-align:center" onclick="go(0)">Retry '+missed.length+' missed</button>':'<p><b>Perfect round, nothing to review.</b></p>')
+'<button class="btn" style="text-align:center" onclick="home()">Back to menu</button>';}
document.addEventListener("keydown",function(e){if(!S.cur||S.p>=S.ids.length)return;var k="1234abcd".indexOf(e.key.toLowerCase());if(k>-1&&!S.cur.a)pick(k%4)});
home();
</script></body></html>
