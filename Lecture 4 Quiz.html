<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecture 4 Quiz</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231e;--mut:#5d6e68;--line:#d4ddd9;--acc:#0f766e;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#17241f;--ink:#e8f1ed;--mut:#9fb2ab;--line:#2c3f38;--acc:#2dd4bf;--ok:#4ade80;--okb:#12351f;--bad:#f87171;--badb:#3b1616}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100%}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px}
p{margin:0 0 12px}.mut{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:block;width:100%;padding:14px 16px;margin:10px 0;border-radius:12px;border:2px solid var(--acc);background:var(--card);text-align:left}
.btn b{display:block}.btn.main{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.main{color:#06201c}}
:root[data-theme="dark"] .btn.main{color:#06201c}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:13px;color:var(--acc);margin-bottom:6px}
.q{font-size:20px;line-height:1.35;margin:4px 0 16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:13px 14px;margin:8px 0;background:var(--card);border:2px solid var(--line);border-radius:12px}
.opt span{font-weight:700;color:var(--acc);min-width:18px}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--bad);background:var(--badb)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:12px;background:var(--card);border:2px solid var(--line);margin:12px 0}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.big{font-size:56px;font-weight:700;color:var(--acc);margin:6px 0 0;line-height:1}
.row{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}
.row .bar{flex:1;margin:0}.row div:first-child{width:46%}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body><main id="app"></main>
<script>
var Q=[["Neuroengineering aims to…", ["Understand, repair, enhance and manipulate nervous system function", "Only record EEG", "Replace the CNS", "Study bones"], "This is the lecture’s definition."], ["Cochlear and retinal implants are examples of…", ["Neuroprosthetics", "Spiking networks", "Patch-clamp", "Imaging agents"], "They restore sensory function."], ["Spiking neural networks are applied in…", ["Robotics, neuroprosthetics and energy-efficient AI", "Bone imaging", "Blood tests", "Ultrasound"], "SNNs mimic neuron spiking."], ["Transcranial magnetic stimulation is…", ["Non-invasive stimulation for depression and neurological disorders", "Surgical implantation", "A recording-only method", "A bone scan"], "DBS is the implanted approach."], ["Artificial neural networks are used in…", ["AI, machine learning and image recognition", "Only EEG", "Bone repair", "Pacemakers"], "They simulate brain network behaviour."], ["Patch-clamp techniques are used to…", ["Study ion channels by measuring tiny electrical currents", "Image bone", "Measure heart rate", "Stimulate cortex"], "They are an electrophysiology tool."], ["EEG and MEG are examples of…", ["Electrophysiology measurements", "Neural stimulation", "Prosthetics", "Network models"], "They record electrical or magnetic brain activity."], ["The main positive ion outside the cell is…", ["Na⁺", "K⁺", "Cl⁻", "Ca²⁺"], "Inside: mainly K⁺."], ["Which ion is the main positive ion inside the cell?", ["K⁺", "Na⁺", "Cl⁻", "Ca²⁺"], "Outside: mainly Na⁺."], ["Case: A lab wants to study single ion-channel currents in a neuron. Which technique?", ["Patch-clamp", "MEG", "TMS", "EEG cap"], "Patch-clamp measures tiny currents through channels."], ["In the Nernst equation, the constant 61 mV…", ["Combines RT/zF with log10 conversion (for z = 1)", "Is permeability", "Is Faraday’s constant alone", "Is membrane capacitance"], "For other valences divide by z."], ["[Ca²⁺]o = 1 mM, [Ca²⁺]i = 100 nM. E(Ca) ≈ ?", ["+122 mV", "+61 mV", "−122 mV", "0 mV"], "(61/2) × log(10⁴) = +122 mV."], ["Case: [Cl⁻]o = 110 mM, [Cl⁻]i = 10 mM. What is E(Cl)?", ["About −64 mV", "About +64 mV", "About −122 mV", "0 mV"], "Valence −1: E = −61 × log(11) ≈ −64 mV."], ["In the resting state pNa/pK ≈ 0.02, giving Em ≈ …", ["−71 mV", "+58 mV", "0 mV", "−90 mV"], "Em sits near EK, well below ENa."], ["The resting potential from the chord conductance equation is…", ["A conductance-weighted average of equilibrium potentials", "The Na⁺ potential", "Always zero", "Set by one ion only"], "Ions with larger conductance pull Em toward their potential."], ["Why is the action potential all-or-nothing?", ["Positive feedback: depolarization opens more Na⁺ channels", "Negative feedback", "The pump forces it", "Myelin amplifies it"], "The swing continues regardless of further input."], ["Na⁺ channel gates: which is normally closed and opens rapidly?", ["m gate", "h gate", "n gate", "Pump gate"], "h is normally open and closes slowly."], ["The undershoot arises because…", ["K⁺ permeability (n gates) stays higher than usual", "Na⁺ permeability is high", "h gates open", "Cl⁻ rushes in"], "pNa/pK ends below its resting value."], ["During the refractory period…", ["The h gates are still shut, blocking Na⁺ channels", "Na⁺ channels reopen freely", "K⁺ channels are absent", "The pump reverses"], "A new AP cannot be generated yet."], ["Threshold is usually about how far above resting potential?", ["10–20 mV", "1–2 mV", "50–60 mV", "100 mV"], "Below threshold K⁺ efflux wins and suppresses depolarization."], ["Case: A Parkinson’s patient with severe tremor is not helped by medication. Which stimulation technology is used?", ["Deep brain stimulation", "Cochlear implant", "Patch-clamp", "Retinal implant"], "DBS treats Parkinson’s, tremors and depression."], ["Case: An ALS patient wants to control a cursor with brain signals. Which system?", ["Brain–computer interface", "Pacemaker", "Cochlear implant", "Nerve graft"], "BCIs let ALS patients communicate directly with devices."], ["Case: In a model neuron, Na⁺ permeability suddenly rises a lot. Where does Em move?", ["Toward ENa (about +58 mV)", "Toward EK (about −80 mV)", "To 0 and stay", "Nowhere"], "Em swings toward the ion with greatest permeability."], ["Case: Simulating visual cortex activity to predict circuit behaviour is…", ["Computational neuroscience", "Patch-clamp", "TMS", "Nerve grafting"], "Math models and simulations study neural circuits."], ["Case: A patient with depression needs non-invasive brain stimulation. Which option?", ["Transcranial magnetic stimulation", "Deep brain implant", "Cochlear implant", "Patch-clamp"], "TMS is non-invasive."], ["Hodgkin and Huxley built the first quantitative AP model using…", ["The squid giant axon", "Frog muscle", "Human cortex", "Cardiac cells"], "Work done 1949–1952."], ["Which change increases the axon space constant λ?", ["Larger axon radius or higher membrane resistance Rm", "Lower Rm", "Smaller radius", "Higher axoplasm resistivity ρi"], "λ rises with Rm and radius, falls with ρi."], ["EPSPs and IPSPs at the postsynaptic cell…", ["Summate to push the neuron toward or away from threshold", "Never interact", "Act on presynaptic cell only", "Create fixed spikes"], "Summation decides firing."], ["The membrane time constant τ depends on…", ["Membrane resistance and capacitance (τ = Rm·Cm)", "Axon length only", "Na⁺ only", "Temperature only"], "τ = Rm × Cm."], ["Which is correct about the Na⁺–K⁺ pump and resting potential?", ["The pump keeps gradients; the potential arises mainly from K⁺ leak", "The pump alone creates −70 mV", "The pump is unrelated", "Na⁺ leak sets it"], "The lecture’s review marks “directly responsible” as false."]];
var T=["Neuroengineering", "Tools & ions", "Nernst & resting potential", "Action potential mechanisms", "Applications", "Models & review"];
function tp(i){return Math.floor(i/5)}
function cs(i){return Q[i][0].indexOf("Case:")==0}
var app=document.getElementById("app"),S={},missed=[];
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function home(){S={};
app.innerHTML='<h1>Lecture 4 quiz</h1><p class="mut">'+Q.length+' questions on neuroengineering, the Nernst equation, action potential mechanisms and axon models, with case studies. Answer, get instant feedback, build a streak.</p>'
+'<button class="btn main" onclick="go(10)"><b>Quick round</b>10 random questions</button>'
+'<button class="btn" onclick="go(\'c\')"><b>Case studies</b>Scenario questions only</button>'
+'<button class="btn" onclick="go(30)"><b>Full run</b>All '+Q.length+', shuffled</button>'
+(missed.length?'<button class="btn" onclick="go(0)"><b>Weak spots</b>Retry the '+missed.length+' you missed</button>':'')
+T.map(function(t,k){return '<button class="btn" onclick="go(-'+(k+1)+')"><b>'+t+'</b>One topic only</button>'}).join("");}
function go(n){var ids=[];for(var i=0;i<Q.length;i++)ids.push(i);
if(n===0)ids=missed.slice();else if(n==="c")ids=ids.filter(cs);else if(n<0)ids=ids.filter(function(i){return tp(i)===-n-1});
ids=sh(ids);if(n>0)ids=ids.slice(0,n);
S={ids:ids,p:0,sc:0,st:0,best:0,miss:[],tt:{}};show();}
function show(){if(S.p>=S.ids.length)return end();
var i=S.ids[S.p],q=Q[i],o=sh([0,1,2,3]);S.cur={i:i,o:o,a:false};var L="ABCD",c=cs(i);
var txt=q[0].replace("Case: ","");
app.innerHTML='<div class="top"><span>Question '+(S.p+1)+' of '+S.ids.length+'</span><span>'+(S.st>1?S.st+' in a row 🔥':'Score '+S.sc)+'</span></div>'
+'<div class="bar"><i style="width:'+(S.p/S.ids.length*100)+'%"></i></div>'
+'<div class="tag">'+T[tp(i)]+(c?' · Case study':'')+'</div><p class="q">'+txt+'</p>'
+o.map(function(k,n){return '<button class="opt" onclick="pick('+n+')"><span>'+L[n]+'</span>'+q[1][k]+'</button>'}).join("")+'<div id="fb"></div>';}
function pick(n){var c=S.cur;if(c.a)return;c.a=true;var q=Q[c.i],ok=c.o[n]===0,b=app.querySelectorAll(".opt"),t=tp(c.i);
S.tt[t]=S.tt[t]||[0,0];S.tt[t][1]++;
b.forEach(function(x,k){x.disabled=true;if(c.o[k]===0)x.classList.add("ok");else if(k===n)x.classList.add("no")});
if(ok){S.sc++;S.st++;S.tt[t][0]++;if(S.st>S.best)S.best=S.st}else{S.st=0;S.miss.push(c.i)}
var m=ok?(S.st>=5?"Unstoppable! ":S.st>=3?"Streak! ":"Correct! "):"Not quite. ";
document.getElementById("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+m+'</b>'+q[2]+'</div><button class="btn main" id="nx" style="text-align:center" onclick="S.p++;show()">'+(S.p+1>=S.ids.length?"See results":"Next question")+'</button>';
document.getElementById("nx").focus();}
function end(){var n=S.ids.length,pc=Math.round(S.sc/n*100);missed=S.miss.slice();
var r=pc>=90?"Physiology pro 🧠":pc>=70?"Strong signal":pc>=50?"Getting there":"Back to the slides";
app.innerHTML='<p class="mut">Round complete</p><div class="big">'+S.sc+'/'+n+'</div><h1>'+r+'</h1><p class="mut">Best streak: '+S.best+' in a row</p>'
+Object.keys(S.tt).map(function(k){var v=S.tt[k];return '<div class="row"><div>'+T[k]+'</div><div class="bar"><i style="width:'+(v[0]/v[1]*100)+'%"></i></div><div>'+v[0]+'/'+v[1]+'</div></div>'}).join("")
+(missed.length?'<button class="btn main" style="text-align:center" onclick="go(0)">Retry '+missed.length+' missed</button>':'<p><b>Perfect round, nothing to review.</b></p>')
+'<button class="btn" style="text-align:center" onclick="home()">Back to menu</button>';}
document.addEventListener("keydown",function(e){if(!S.cur||S.p>=S.ids.length)return;var k="1234abcd".indexOf(e.key.toLowerCase());if(k>-1&&!S.cur.a)pick(k%4)});
home();
</script></body></html>
