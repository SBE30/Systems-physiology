<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physiology Quiz</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231e;--mut:#5d6e68;--line:#d4ddd9;--acc:#0f766e;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#17241f;--ink:#e8f1ed;--mut:#9fb2ab;--line:#2c3f38;--acc:#2dd4bf;--ok:#4ade80;--okb:#12351f;--bad:#f87171;--badb:#3b1616}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100%}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 6px}
p{margin:0 0 12px}.mut{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:block;width:100%;padding:14px 16px;margin:10px 0;border-radius:12px;border:2px solid var(--acc);background:var(--card);text-align:left}
.btn b{display:block}.btn.main{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.main{color:#06201c}}
:root[data-theme="dark"] .btn.main{color:#06201c}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:13px;color:var(--acc);margin-bottom:6px}
.q{font-size:20px;line-height:1.35;margin:4px 0 16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:13px 14px;margin:8px 0;background:var(--card);border:2px solid var(--line);border-radius:12px}
.opt span{font-weight:700;color:var(--acc);min-width:18px}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--bad);background:var(--badb)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:12px;background:var(--card);border:2px solid var(--line);margin:12px 0}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.big{font-size:56px;font-weight:700;color:var(--acc);margin:6px 0 0;line-height:1}
.row{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}
.row .bar{flex:1;margin:0}.row div:first-child{width:46%}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body><main id="app"></main>
<script>
var Q=[["Which response set is typical of sympathetic activation?", ["↑ heart rate, dilated airways, blood flow redirected to muscles", "↓ heart rate, constricted airways, more digestion", "↓ heart rate, dilated airways, more saliva", "↑ heart rate, constricted airways, bladder contraction"], "Sympathetic = “fight or flight”: it prepares the body for stress and rapid action."], ["Respiratory sinus arrhythmia is a marker of which activity?", ["Parasympathetic (vagal) activity", "Sympathetic cholinergic sweating", "Somatic motor firing", "Enteric reflexes"], "Heart-rate variation with breathing reflects vagal control."], ["A galvanic skin response (GSR) sensor reflects…", ["Sympathetic activation via skin conductance and sweat", "Speed of impulses in peripheral nerves", "Muscle fibre length", "Cortical magnetic fields"], "Sweat changes skin conductance, tracking stress and emotion."], ["QSART and TST sweat tests assess…", ["Sympathetic cholinergic control of sweating", "Parasympathetic control of the heart", "Bone mineral density", "Nerve conduction speed"], "They measure sweat volume or pattern."], ["Case: Mariam, 23, has hand tingling and dizziness on standing after a wrist injury. Which pair of tests fits both problems?", ["Nerve conduction study + heart rate variability", "fMRI + EEG", "EMG + MEG", "PET + SPECT"], "NCS tests peripheral nerve conduction (tingling); HRV tests autonomic balance (dizziness on standing)."], ["What first detects the patellar tendon tap in the knee-jerk reflex?", ["Quadriceps stretch receptors", "Brainstem motor neurons", "The cerebellum", "Hamstring motor endplates"], "Stretch receptors signal via a sensory neuron to the spinal cord."], ["Why are spinal reflexes useful?", ["Rapid protective responses without conscious control", "They replace the brain for all movement", "They only act on smooth muscle", "They slow down motor output"], "Spinal integration gives fast responses and supports posture and muscle tone."], ["Which structure mainly coordinates movement, balance and motor learning?", ["Cerebellum", "Brainstem", "Spinal cord", "Enteric system"], "The cerebellum coordinates movement and contributes to balance and posture."], ["Breathing and cardiovascular control are supported mainly by the…", ["Brainstem", "Cerebrum", "Cerebellum", "Cranial sutures"], "The brainstem supports vital automatic functions."], ["On the motor cortex map, legs and feet sit…", ["Near the midline at the top", "On the lateral surface", "Only in the cerebellum", "In the brainstem"], "Top/midline = legs and feet; middle = trunk, arms, hands; side = face, lips, tongue."], ["After a stroke another region takes over speech. This is…", ["Functional plasticity", "Structural plasticity", "A spinal reflex", "Sympathetic rebound"], "Functional plasticity shifts a function from damaged to healthy areas."], ["Repeated practice of a skill tends to…", ["Strengthen the relevant neural pathways", "Delete the pathways", "Switch off the cortex", "Convert reflexes to voluntary action"], "Repetition strengthens pathways: the basis of neurorehabilitation."], ["Which method records brain electrical activity from the scalp?", ["EEG", "PET", "MEG", "SPECT"], "EEG is scalp-based; ECoG and intracortical recordings are more invasive."], ["Typical BCI workflow?", ["Record signal → process/classify → translate to device command", "Classify → record → stimulate muscle", "Translate → record → classify", "Stimulate → classify → record"], "Signals are decoded into commands, with no normal muscle output needed."], ["Case: A brainstem stroke leaves a patient unable to move or speak, cognition intact. Best non-invasive communication option?", ["EEG-based brain–computer interface", "Intracortical microarray first", "Nerve conduction study", "Galvanic skin response"], "EEG-based BCI is the non-invasive example."], ["Which cardiac/skeletal pair is correct?", ["Cardiac: involuntary and striated", "Cardiac: voluntary and smooth", "Skeletal: involuntary and smooth", "Smooth: voluntary and striated"], "Skeletal is voluntary and striated; smooth is involuntary and non-striated."], ["What exposes actin attachment sites?", ["Calcium released from storage sites", "ATP leaving the sarcomere", "Tendon stretch", "Thick filament shortening"], "The action potential triggers calcium release."], ["Cross-bridge power stroke uses ATP and moves actin…", ["Toward the sarcomere centre", "Away from the centre", "Out of the sarcomere", "Toward the tendon only"], "Sliding actin toward the centre shortens the sarcomere."], ["During contraction, which band stays the same width?", ["A band", "I band", "H zone", "Whole sarcomere"], "A band = thick filament length. I band and H zone shorten."], ["Muscle shortening results from…", ["Filament sliding", "Filaments shortening", "Z discs moving apart", "Myosin pushing the Z line out"], "Filaments themselves do not shorten."], ["Holding a plank without joint rotation is…", ["Isometric", "Concentric", "Eccentric", "Passive"], "Length stays constant while tension resists the load."], ["Case: Lowering a heavy box slowly. The muscles are acting…", ["Eccentrically (active lengthening)", "Concentrically", "Isometrically", "Passively"], "Eccentric contraction controls movement: negative mechanical work."], ["The antagonist is the muscle that…", ["Produces the opposite joint action", "Fixes a segment", "Assists the agonist", "Is the prime mover"], "Agonist = prime mover; stabilizer fixes a segment."], ["Greater pennation means…", ["More fibres fit, but less fibre force acts along the tendon axis", "Fewer fibres in a given area", "All force along the tendon", "Faster shortening always"], "Trade-off: more fibres, angled pull."], ["Same muscle force, larger moment arm gives…", ["Larger joint moment", "Smaller joint moment", "No change", "Higher velocity only"], "Moment = force × perpendicular distance."], ["Optimal sarcomere length for maximal tension?", ["About 2.1–2.2 µm", "About 1.2 µm", "About 3.6 µm", "About 5 µm"], "Optimal filament overlap occurs around 2.1–2.2 µm."], ["At very short sarcomere lengths, force falls because…", ["Filaments overlap too much and thick filaments hit Z lines", "Thin filaments detach fully", "ATP rises", "Calcium is absent"], "Excess overlap limits cross-bridge cycling."], ["Passive tension…", ["Rises as elastic structures are stretched", "Needs muscle activation", "Peaks at short lengths", "Equals active force"], "Passive force needs no activation."], ["Contractile force is highest when velocity is…", ["Zero (isometric)", "Maximum", "Medium", "Negative only"], "Force falls as velocity rises."], ["Case: Sara can curl a heavy weight slowly but not fast. Principle?", ["Force–velocity relationship", "Neural plasticity", "Autonomic balance", "Respiratory arrhythmia"], "Higher load means slower shortening and more force."], ["In engineering terms, muscle behaves like a…", ["Linear motor that pulls", "Linear motor that pushes", "Rotary motor", "Hydraulic pump"], "Muscles pull but cannot push."], ["Case: M = 600 N, m = 4 cm, α = 90°, h = 32 cm. Using H = m·M·sin α / h, H = ?", ["75 N", "600 N", "150 N", "4800 N"], "(4 × 600 × 1) / 32 = 75 N."], ["Feedback loop F1 is mainly…", ["A reflex-like arc from joint, tendon and muscle receptors", "Vision and sound feedback", "Skin pressure only", "A feedforward command"], "F1 uses interoceptors. F2 = kinesthetic; F3 = exteroceptors."], ["Feedback loops F2 and F3 pass through a comparator that…", ["Compares actual conditions with those expected", "Amplifies motor units", "Stores ATP", "Blocks calcium"], "Mismatch generates new commands."], ["Static equilibrium in 2D requires…", ["Horizontal forces, vertical forces and moments each sum to zero", "Only vertical forces zero", "Only moments zero", "Muscle force equals hand force"], "Joint reaction forces and moments supply the balance."], ["The latent period is the delay between…", ["Stimulation and onset of contraction", "Contraction and relaxation", "Two twitches", "Tetanus and fatigue"], "The action potential ends before the contractile apparatus is operational."], ["Tetanus occurs when…", ["Stimuli come so fast the fibre cannot relax", "The fibre fully relaxes between stimuli", "The fibre is stretched to 170%", "Calcium is depleted"], "Twitches fuse into a maximal sustained contraction."], ["Human muscle force plateaus at about…", ["60 Hz", "10 Hz", "25 Hz", "200 Hz"], "No further gain above about 60 Hz."], ["Electromyography records…", ["Electrical activity of skeletal muscle", "Bone density", "Heart rhythm only", "Cortical blood flow"], "EMG detects potentials from activated muscle cells."], ["Why does force reaching the tendon lag fibre force generation?", ["Series elastic elements must stretch first", "Calcium is slow", "Parallel elements shorten", "ATP is delayed"], "Force transmits only after series elastic elements stretch."], ["Muscle power equals…", ["Force × velocity", "Force ÷ velocity", "Force × length", "Velocity ÷ force"], "Work/time = force × distance/time."], ["Power peaks at about what fraction of maximum force?", ["One-third", "One-tenth", "One-half", "Full maximum"], "Peak power occurs at an intermediate load."], ["A strap muscle: volume 240 cm³, length 30 cm, 20 N/cm². Isometric force?", ["160 N", "16 N", "600 N", "1600 N"], "Area = 240/30 = 8 cm²; F = 8 × 20 = 160 N."], ["Case: Muscle A is parallel, PCA 10 cm². Muscle B is pennate, PCA 25 cm². Which has greater force capacity?", ["B, because PCA is larger", "A, because parallel is stronger", "A, shorter moment arm", "Equal"], "Maximum force relates to physiological cross-sectional area."], ["A unipinnate muscle: fibres total 500 N at 15°. Force along the tendon ≈?", ["483 N", "500 N", "129 N", "1000 N"], "500 × cos 15° ≈ 483 N."]];
var T=["ANS & autonomic tests", "Spinal cord & brain", "Plasticity, brain tests & BCI", "Sarcomere & sliding filament", "Contractions & force", "Length–tension & force–velocity", "Engineering lever model", "Twitch, tetanus & EMG", "Power & calculations"];
function tp(i){return Math.floor(i/5)}
function cs(i){return Q[i][0].indexOf("Case:")==0}
var app=document.getElementById("app"),S={},missed=[];
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function home(){S={};
app.innerHTML='<h1>Physiology quiz</h1><p class="mut">'+Q.length+' questions from Lectures 5A, 5B and 6: neurophysiology and muscle physiology, with case studies. Answer, get instant feedback, build a streak.</p>'
+'<button class="btn main" onclick="go(10)"><b>Quick round</b>10 random questions</button>'
+'<button class="btn" onclick="go(\'c\')"><b>Case studies</b>Scenario questions only</button>'
+'<button class="btn" onclick="go(45)"><b>Full run</b>All '+Q.length+', shuffled</button>'
+(missed.length?'<button class="btn" onclick="go(0)"><b>Weak spots</b>Retry the '+missed.length+' you missed</button>':'')
+T.map(function(t,k){return '<button class="btn" onclick="go(-'+(k+1)+')"><b>'+t+'</b>One topic only</button>'}).join("");}
function go(n){var ids=[];for(var i=0;i<Q.length;i++)ids.push(i);
if(n===0)ids=missed.slice();else if(n==="c")ids=ids.filter(cs);else if(n<0)ids=ids.filter(function(i){return tp(i)===-n-1});
ids=sh(ids);if(n>0)ids=ids.slice(0,n);
S={ids:ids,p:0,sc:0,st:0,best:0,miss:[],tt:{}};show();}
function show(){if(S.p>=S.ids.length)return end();
var i=S.ids[S.p],q=Q[i],o=sh([0,1,2,3]);S.cur={i:i,o:o,a:false};var L="ABCD",c=cs(i);
var txt=q[0].replace("Case: ","");
app.innerHTML='<div class="top"><span>Question '+(S.p+1)+' of '+S.ids.length+'</span><span>'+(S.st>1?S.st+' in a row 🔥':'Score '+S.sc)+'</span></div>'
+'<div class="bar"><i style="width:'+(S.p/S.ids.length*100)+'%"></i></div>'
+'<div class="tag">'+T[tp(i)]+(c?' · Case study':'')+'</div><p class="q">'+txt+'</p>'
+o.map(function(k,n){return '<button class="opt" onclick="pick('+n+')"><span>'+L[n]+'</span>'+q[1][k]+'</button>'}).join("")+'<div id="fb"></div>';}
function pick(n){var c=S.cur;if(c.a)return;c.a=true;var q=Q[c.i],ok=c.o[n]===0,b=app.querySelectorAll(".opt"),t=tp(c.i);
S.tt[t]=S.tt[t]||[0,0];S.tt[t][1]++;
b.forEach(function(x,k){x.disabled=true;if(c.o[k]===0)x.classList.add("ok");else if(k===n)x.classList.add("no")});
if(ok){S.sc++;S.st++;S.tt[t][0]++;if(S.st>S.best)S.best=S.st}else{S.st=0;S.miss.push(c.i)}
var m=ok?(S.st>=5?"Unstoppable! ":S.st>=3?"Streak! ":"Correct! "):"Not quite. ";
document.getElementById("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+m+'</b>'+q[2]+'</div><button class="btn main" id="nx" style="text-align:center" onclick="S.p++;show()">'+(S.p+1>=S.ids.length?"See results":"Next question")+'</button>';
document.getElementById("nx").focus();}
function end(){var n=S.ids.length,pc=Math.round(S.sc/n*100);missed=S.miss.slice();
var r=pc>=90?"Physiology pro 🧠":pc>=70?"Strong signal":pc>=50?"Getting there":"Back to the slides";
app.innerHTML='<p class="mut">Round complete</p><div class="big">'+S.sc+'/'+n+'</div><h1>'+r+'</h1><p class="mut">Best streak: '+S.best+' in a row</p>'
+Object.keys(S.tt).map(function(k){var v=S.tt[k];return '<div class="row"><div>'+T[k]+'</div><div class="bar"><i style="width:'+(v[0]/v[1]*100)+'%"></i></div><div>'+v[0]+'/'+v[1]+'</div></div>'}).join("")
+(missed.length?'<button class="btn main" style="text-align:center" onclick="go(0)">Retry '+missed.length+' missed</button>':'<p><b>Perfect round, nothing to review.</b></p>')
+'<button class="btn" style="text-align:center" onclick="home()">Back to menu</button>';}
document.addEventListener("keydown",function(e){if(!S.cur||S.p>=S.ids.length)return;var k="1234abcd".indexOf(e.key.toLowerCase());if(k>-1&&!S.cur.a)pick(k%4)});
home();
</script></body></html>
