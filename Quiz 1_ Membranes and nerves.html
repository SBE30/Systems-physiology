<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz 1: Membranes and Nerves</title>
<style>
:root{--bg:#eef5f4;--sf:#fff;--tx:#14302f;--mu:#5b7573;--ac:#0e7c86;--ok:#1f8a4c;--okb:#dff3e6;--no:#c0392b;--nob:#fbe4e1;--bd:#cfe0de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f1f;--sf:#14302f;--tx:#e6f2f0;--mu:#9bb8b5;--ac:#4fc3cc;--ok:#5fd68c;--okb:#16402b;--no:#ff8b7d;--nob:#4a2320;--bd:#2a4a48}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.5 Georgia,"Iowan Old Style",serif;padding:16px;max-width:640px;margin:0 auto}
h1{font-size:26px;margin:8px 0 4px;line-height:1.2}p{margin:0 0 12px}
.mu{color:var(--mu);font-size:15px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.top{display:flex;justify-content:space-between;font:600 14px system-ui,sans-serif;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:12px}
.q{font-size:19px;font-weight:600;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:16px}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.opt:disabled{cursor:default}
.fb{margin-top:6px;padding:12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okb)}.fb.no{background:var(--nob)}
.go{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:13px 20px;font:600 16px system-ui,sans-serif;margin-top:14px;width:100%}
.go.alt{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.big{font-size:56px;font-weight:700;line-height:1;margin:6px 0}
.sec{display:block}
.note{font-size:14px;color:var(--mu);margin-top:10px}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<div id="app"></div>
<script>
var Q=[
["Cell membrane and transport","Transport across the cell membrane can occur through:",["Facilitated diffusion, which is not affected by temperature","Active transport that can occur with the concentration gradient","Passive transport that does not need energy","Pinocytosis, which needs an enzyme"],2,"Passive transport needs no metabolic energy."],
["Cell membrane and transport","ICF differs from ECF in that ICF has a higher concentration of:",["Chloride ions","Potassium ions","Sodium ions","Both a and c"],1,"Potassium is concentrated inside cells."],
["Cell membrane and transport","The rate of diffusion of a particle across a membrane will increase if:",["Its lipid solubility increases","The membrane area decreases","The membrane thickness increases","The particle size increases"],0,"Greater lipid solubility speeds diffusion through the bilayer."],
["Cell membrane and transport","Osmosis:",["Occurs against the concentration gradient","Needs a carrier","Needs energy","Is a passive process"],3,"Osmosis is passive water movement across a selectively permeable membrane."],
["Cell membrane and transport","ECF and ICF are similar in:",["Potassium concentration","Osmolality","Sodium concentration","Calcium concentration"],1,"The two compartments have about equal osmolality."],
["Cell membrane and transport","The human cell membrane:",["Is a phospholipid bilayer","Consists mainly of carbohydrate","Is impermeable to lipid soluble molecules","Has no proteins"],0,"It is a phospholipid bilayer containing proteins."],
["Cell membrane and transport","Sodium potassium pump:",["Is an example of uniport","Pumps 3 Na+ out and 2 K+ in","Is the only cause of resting potential","Causes the depolarization phase"],1,"Three sodium out and two potassium in per ATP."],
["Cell membrane and transport","Regarding transport mechanisms:",["Facilitated diffusion is active","Passive transport requires energy","Symport carries one substance in one direction","Facilitated diffusion occurs down the concentration gradient"],3,"Facilitated diffusion follows the gradient and needs no energy."],
["Nerve potentials","Nerve resting membrane potential:",["ECF sodium is less than ICF sodium","Depends on K+ permeability being greater than Na+ permeability","Chloride is greatest inside the cell","A more negative resting potential makes the cell more excitable"],1,"Higher potassium permeability sets the resting potential."],
["Nerve potentials","The firing level of a stimulated nerve fiber:",["Is reached at about minus 65 mV","Is reached at the end of the spike","Is when potassium permeability increases","Is when repolarization starts"],0,"Your answer key gives minus 65 mV. Many textbooks say about minus 55 mV, so check which value your course uses."],
["Nerve potentials","Unmyelinated nerves differ from myelinated nerves in that they:",["Are more excitable","Conduct by saltatory conduction","Have no nodes of Ranvier","Conduct faster"],2,"Without myelin there are no nodes of Ranvier."],
["Nerve potentials","Resting membrane potential in the nerve is:",["Mainly due to potassium outflow","Mainly due to the Na/K pump","Mainly due to potassium inflow","About minus 50 mV"],0,"Potassium leaving through leak channels is the main contributor."],
["Nerve potentials","During depolarization of the nerve action potential:",["K+ and Cl- influx increases","Membrane is more permeable to K+ than Na+","Na+ influx increases","Sodium channels are inactivated"],2,"Depolarization is driven by sodium influx."],
["Nerve potentials","Voltage gated sodium channels:",["Activation gates are closed at rest","Inactivation gates are closed at rest","At firing level the inactivation channels open","None of the above"],0,"At rest the activation gate is closed and the inactivation gate is open."],
["Nerve potentials","The absolute refractory period:",["Is due to hyperpolarization","Is due to inactivation of sodium channels","Is an increased excitability state","Is the same in skeletal and cardiac muscle"],1,"Inactivated sodium channels cannot fire again yet."],
["Nerve potentials","The relative refractory period:",["Has increased excitability","Needs a stimulus stronger than threshold","Occupies the whole ascending limb","Has all K+ channels closed"],1,"A stronger than normal stimulus is needed."],
["Nerve potentials","Saltatory conduction: all are true EXCEPT:",["It occurs in myelinated fibers","Positive charges jump between nodes","It increases conduction velocity","It consumes more energy"],3,"It actually conserves energy compared with continuous conduction."],
["Nerve potentials","Saltatory conduction:",["Is seen only in myelinated fibers","Is slower than local circuit conduction","Generates action potentials at internodal spaces","Uses more energy than local circuit conduction"],0,"It needs myelin, with action potentials at the nodes."],
["True or false","The cell membrane is impermeable to lipid soluble substances.",["True","False"],1,"Lipid soluble substances cross the bilayer readily."],
["True or false","Diffusion rate is directly proportional to the molecular weight of the substance.",["True","False"],1,"Bigger molecules diffuse more slowly."],
["True or false","The resting membrane potential is mainly due to the Na/K pump.",["True","False"],1,"It comes mainly from potassium leak. The pump maintains the gradients."],
["True or false","A subthreshold stimulus can produce a local response that does not obey the all or none law.",["True","False"],0,"Local responses are graded."],
["True or false","In a nerve, sodium permeability is greatly increased at firing level.",["True","False"],0,"Voltage gated sodium channels open sharply near threshold."]
];
var L="abcd",app=document.getElementById("app"),S;
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function home(){var secs=[];Q.forEach(function(q){if(secs.indexOf(q[0])<0)secs.push(q[0])});
var h='<h1>Quiz 1: Membranes and nerves</h1><p class="mu">23 past questions. Tap an answer to see why instantly. Build a streak.</p>';
h+='<button class="go" data-s="">All questions (23)</button>';
secs.forEach(function(s){var n=Q.filter(function(q){return q[0]==s}).length;h+='<button class="go alt" data-s="'+s+'">'+s+' ('+n+')</button>'});
app.innerHTML=h;
app.querySelectorAll("button").forEach(function(b){b.onclick=function(){start(b.dataset.s)}})}
function start(sec){var qs=Q.filter(function(q){return !sec||q[0]==sec});
for(var i=qs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=qs[i];qs[i]=qs[j];qs[j]=t}
S={qs:qs,i:0,sc:0,st:0,best:0,miss:[]};show()}
function show(){var q=S.qs[S.i],n=S.qs.length;
var h='<div class="top"><span>'+(S.i+1)+' of '+n+'</span><span>Streak '+S.st+' | Score '+S.sc+'</span></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div>';
h+='<div class="card"><div class="mu">'+q[0]+'</div><div class="q">'+esc(q[1])+'</div><div id="o">';
q[2].forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+(q[2].length>2?L[k]+') ':'')+esc(o)+'</button>'});
h+='</div><div id="f"></div></div>';app.innerHTML=h;
app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}})}
function pick(k){var q=S.qs[S.i],ok=k==q[3];
app.querySelectorAll(".opt").forEach(function(b,i){b.disabled=true;if(i==q[3])b.classList.add("ok");else if(i==k)b.classList.add("no")});
if(ok){S.sc++;S.st++;if(S.st>S.best)S.best=S.st}else{S.st=0;S.miss.push(q)}
var msg=ok?(S.st>=3?"Correct. "+S.st+" in a row.":"Correct."):"Not quite. Answer: "+(q[2].length>2?L[q[3]]+") ":"")+esc(q[2][q[3]]);
var last=S.i==S.qs.length-1;
document.getElementById("f").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+msg+'</b><br>'+esc(q[4])+'</div><button class="go" id="nx">'+(last?"See results":"Next question")+'</button>';
var nx=document.getElementById("nx");nx.focus();nx.onclick=function(){if(last)end();else{S.i++;show()}}}
function end(){var n=S.qs.length,p=Math.round(S.sc/n*100);
var m=p==100?"Perfect run.":p>=80?"Strong. Review the misses below.":p>=50?"Good base. Retry the misses.":"Worth another pass. Start with the explanations.";
var h='<div class="card"><div class="mu">Final score</div><div class="big">'+S.sc+' / '+n+'</div><p>'+p+'%. '+m+' Best streak: '+S.best+'.</p>';
if(S.miss.length){h+='<b>Review</b>';S.miss.forEach(function(q){h+='<p class="note"><b>'+esc(q[1])+'</b><br>Answer: '+esc(q[2][q[3]])+'. '+esc(q[4])+'</p>'})}
h+='<button class="go" id="rt">'+(S.miss.length?"Retry missed questions":"Play again")+'</button><button class="go alt" id="hm">Back to start</button></div>';
app.innerHTML=h;
document.getElementById("rt").onclick=function(){if(S.miss.length){var m=S.miss;S={qs:m,i:0,sc:0,st:0,best:0,miss:[]};show()}else home()};
document.getElementById("hm").onclick=home}
home();
</script></body></html>
